<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 90" width="650" height="90">
  <defs>
    <!-- Degradado suave monocromo para la campana -->
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
  </defs>

  <!-- SECCIÓN IZQUIERDA: Campana y bomba de afinación del trombón -->
  <g id="trombon-cuerpo" transform="translate(10, 8)">
    <!-- Campana acampanada elegante (Silueta editorial) -->
    <path d="M 0 10 Q 30 18 45 34 L 45 40 Q 30 56 0 64 L 0 62 Q 25 50 38 37 L 38 37 Q 25 24 0 12 Z" fill="#111"/>
    <!-- Aro exterior de la campana -->
    <ellipse cx="2" cy="37" rx="3" ry="27" fill="#111"/>

    <!-- Tubo que sale de la campana hacia atrás (bomba afinación) -->
    <path d="M 45 35 L 75 35 Q 90 35 90 20 Q 90 5 75 5 L 40 5" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tubo inferior hacia el tudel -->
    <path d="M 45 39 L 75 39 Q 95 39 95 50 Q 95 62 80 62 L 55 62" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Contrapeso y barras de unión (Transmisor clásico) -->
    <line x1="60" y1="5" x2="60" y2="35" stroke="#111" stroke-width="3"/>
    <circle cx="60" cy="20" r="5" fill="#111"/>
    <line x1="75" y1="39" x2="75" y2="62" stroke="#111" stroke-width="2"/>
  </g>

  <!-- SECCIÓN CENTRAL: LAS VARAS QUE ENMARCAN EL TEXTO EDITORIAL -->
  <g id="varas-enmarcadoras">
    <!-- Vara superior (Línea de guía superior del título) -->
    <!-- Nace en x=95, se extiende hasta x=620 -->
    <line x1="105" y1="28" x2="620" y2="28" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Boquilla insertada en el extremo superior derecho -->
    <path d="M 620 25 L 635 23 L 642 18 L 645 18 L 645 38 L 642 38 L 635 33 L 620 31 Z" fill="#111"/>

    <!-- TEXTO EDITORIAL ENTRE LAS DOS VARAS -->
    <!-- Título principal en Baskerville Mayúsculas con tracking elegante -->
    <text x="360" y="48" font-family="Baskerville, 'Times New Roman', serif" font-size="19" font-weight="bold" letter-spacing="4" fill="#111" text-anchor="middle">
      NIVEL 1 · PRIMERAS FLEXIBILIDADES
    </text>
    
    <!-- Subtítulo o descriptor en versalitas / itálica fina -->
    <text x="360" y="61" font-family="Baskerville, 'Times New Roman', serif" font-size="9" font-style="italic" letter-spacing="1.5" fill="#555" text-anchor="middle">
      CONEXIÓN ENTRE Sib₂ — Fa₃ — Sib₃ EN LAS SIETE POSICIONES
    </text>

    <!-- Vara inferior (Línea de guía inferior del título) -->
    <!-- Nace en x=105, corre paralela y dobla en el codo de la vara exterior -->
    <line x1="105" y1="68" x2="600" y2="68" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Puente / Travesaño de la vara corredera -->
    <line x1="220" y1="28" x2="220" y2="68" stroke="#888" stroke-width="1.8" stroke-dasharray="2,3"/>
    <line x1="500" y1="28" x2="500" y2="68" stroke="#888" stroke-width="1.8" stroke-dasharray="2,3"/>

    <!-- Codo de la vara (curva en U al final a la derecha) -->
    <path d="M 600 68 Q 618 68 618 78 Q 618 86 600 86 L 105 86" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="6,4"/>
  </g>
</svg>
